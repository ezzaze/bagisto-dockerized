# Production stack — self-contained, used ON ITS OWN (not layered on
# docker-compose.yml, which is dev-only):
#
#     docker compose -f docker-compose.prod.yml build
#     docker compose -f docker-compose.prod.yml up -d
#
# Differences from the dev compose that matter:
#   * Image is built from the `prod` target: application code AND vendor/ are
#     baked into the immutable image (composer install --no-dev at build time),
#     so there is NO ./backend bind mount and NO composer step at runtime.
#     This is why the dev "vendor does not exist and could not be created"
#     failure cannot happen here.
#   * The only host file the containers read is backend/.env (mounted rw so the
#     first-boot installer can write APP_KEY / DB details into it). Everything
#     else — code, vendor — comes from the image. Secrets stay out of the image.
#   * storage/, public/, and bootstrap/cache are shared via named volumes so
#     uploads, the storage symlink, static assets, and the optimize cache pass
#     are visible to every container (and to nginx) and survive restarts.
#   * MySQL/Redis/Elasticsearch are not published to the host.
#
# Before first boot, in backend/.env set: APP_ENV=production, APP_DEBUG=false,
# a real APP_KEY, real DB/Redis credentials; and in the root .env set real
# DB_PASSWORD / DB_ROOT_PASSWORD. See README "Production deployment".

x-prod-build: &prod-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod

x-prod-env: &prod-env
  env_file:
    - ./backend/.env
  environment:
    # Enforced regardless of a stale backend/.env — install.sh refuses to seed
    # demo/sample products when APP_ENV=production.
    APP_ENV: production

# Web/FPM containers: serve static assets + read/write the storage symlink and
# the shared config cache; the installer writes APP_KEY into the mounted .env.
x-app-web-volumes: &app-web-volumes
  - app_storage:/var/www/html/storage
  - app_public:/var/www/html/public
  - app_bootstrap_cache:/var/www/html/bootstrap/cache
  - ./backend/.env:/var/www/html/.env

# Worker containers (queue/scheduler): no public/ needed.
x-app-worker-volumes: &app-worker-volumes
  - app_storage:/var/www/html/storage
  - app_bootstrap_cache:/var/www/html/bootstrap/cache
  - ./backend/.env:/var/www/html/.env

services:
  mysql:
    image: mysql:8.0
    container_name: bagisto-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bagisto}
      MYSQL_USER: ${DB_USERNAME:-bagisto}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [bagisto]

  redis:
    image: redis:7-alpine
    container_name: bagisto-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bagisto]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: bagisto-prod-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [bagisto]

  # One-shot per deploy: installs on first boot (migrations + core-data seed),
  # then links storage and bakes production caches on every run.
  installer:
    <<: [*prod-build, *prod-env]
    container_name: bagisto-prod-installer
    command:
      - sh
      - -c
      - /var/www/scripts/install.sh && php artisan storage:link --force && /var/www/scripts/optimize.sh
    volumes: *app-web-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [bagisto]

  app:
    <<: [*prod-build, *prod-env]
    container_name: bagisto-prod-app
    volumes: *app-web-volumes
    depends_on:
      installer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [bagisto]

  queue:
    <<: [*prod-build, *prod-env]
    container_name: bagisto-prod-queue
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.queue.conf"]
    environment:
      APP_ENV: production
      QUEUE_WORKERS: ${QUEUE_WORKERS:-2}
    volumes: *app-worker-volumes
    depends_on:
      installer:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [bagisto]

  scheduler:
    <<: [*prod-build, *prod-env]
    container_name: bagisto-prod-scheduler
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.scheduler.conf"]
    volumes: *app-worker-volumes
    depends_on:
      installer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [bagisto]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: bagisto-prod-nginx
    # Read-only view of the same code artifacts the app serves: static assets
    # under public/, plus storage/ so the public/storage symlink resolves.
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [bagisto]

volumes:
  mysql_data:
  redis_data:
  es_data:
  app_storage:
  app_public:
  app_bootstrap_cache:

networks:
  bagisto:
    driver: bridge
